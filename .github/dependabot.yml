version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 5
    groups:
      next-framework:
        patterns:
          - "next"
          - "eslint-config-next"
      react-framework:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: "Asia/Dubai"
    open-pull-requests-limit: 3
    labels:
      - dependencies
