name: Internal Link Normalization

on:
  push:
    branches:
      - feature/homepage-v2-crm-intake

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'normalize internal links') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-v2-crm-intake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert literal internal anchors to Next Link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          anchor = re.compile(r'<a(\s+[^>]*href="/[^"]*"[^>]*)>(.*?)</a>', re.DOTALL)
          changed = []

          for path in Path("src").rglob("*.tsx"):
              original = path.read_text(encoding="utf-8")
              updated, count = anchor.subn(r'<Link\1>\2</Link>', original)
              if not count:
                  continue

              if 'from "next/link"' not in updated and "from 'next/link'" not in updated:
                  directive = re.match(r'^("use client";?\s*\n)', updated)
                  if directive:
                      pos = directive.end()
                      updated = updated[:pos] + '\nimport Link from "next/link"\n' + updated[pos:]
                  else:
                      updated = 'import Link from "next/link"\n' + updated

              path.write_text(updated, encoding="utf-8")
              changed.append((str(path), count))

          print(f"Normalized {sum(count for _, count in changed)} internal links across {len(changed)} files")
          for path, count in changed:
              print(f"  {path}: {count}")
          PY

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit normalized internal navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No internal-link changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize internal links"
          git push origin HEAD:feature/homepage-v2-crm-intake
