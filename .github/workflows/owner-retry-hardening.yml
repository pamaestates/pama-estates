name: Owner Retry Identity Hardening

on:
  push:
    branches:
      - feature/homepage-v2-crm-intake

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'owner retry identity applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-v2-crm-intake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply edited-retry identity fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/sell-with-us/page.tsx")
          text = path.read_text(encoding="utf-8")

          old_state = "  const [submissionId, setSubmissionId] = useState<string | null>(null);\n  const [isSubmitting, setIsSubmitting] = useState(false);"
          new_state = "  const [submissionId, setSubmissionId] = useState<string | null>(null);\n  const [submissionFingerprint, setSubmissionFingerprint] = useState<string | null>(null);\n  const [isSubmitting, setIsSubmitting] = useState(false);"
          if old_state not in text:
              raise SystemExit("submission state anchor not found")
          text = text.replace(old_state, new_state, 1)

          old_identity = "    const id = submissionId ?? newSubmissionId(\"owner-inquiry\");\n    if (!submissionId) setSubmissionId(id);"
          new_identity = "\n".join([
              "    const fingerprint = JSON.stringify({",
              "      ...form,",
              "      email: form.email.trim().toLowerCase(),",
              "      name: form.name.trim(),",
              "      whatsapp: form.whatsapp.trim(),",
              "    });",
              "",
              "    const id =",
              "      submissionId && submissionFingerprint === fingerprint",
              "        ? submissionId",
              "        : newSubmissionId(\"owner-inquiry\");",
              "",
              "    if (id !== submissionId) setSubmissionId(id);",
              "    if (fingerprint !== submissionFingerprint) setSubmissionFingerprint(fingerprint);",
          ])
          if old_identity not in text:
              raise SystemExit("retry identity anchor not found")
          text = text.replace(old_identity, new_identity, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Verify lint
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit owner retry fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/sell-with-us/page.tsx
          if git diff --cached --quiet; then
            echo "No retry identity changes to commit."
            exit 0
          fi
          git commit -m "fix: owner retry identity applied"
          git push origin HEAD:feature/homepage-v2-crm-intake
