name: Owner Retry Identity Hardening

on:
  push:
    branches:
      - feature/homepage-v2-crm-intake

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message != 'fix: owner retry identity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-v2-crm-intake
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fix edited-retry identity on owner form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/app/sell-with-us/page.tsx")
          s = p.read_text(encoding="utf-8")
          old = "  const [submissionId, setSubmissionId] = useState<string | null>(null);\n  const [isSubmitting, setIsSubmitting] = useState(false);"
          new = "  const [submissionId, setSubmissionId] = useState<string | null>(null);\n  const [submissionFingerprint, setSubmissionFingerprint] = useState<string | null>(null);\n  const [isSubmitting, setIsSubmitting] = useState(false);"
          if old not in s:
              raise SystemExit("submission state anchor not found")
          s = s.replace(old, new, 1)
          old = "    const id = submissionId ?? newSubmissionId(\"owner-inquiry\");\n    if (!submissionId) setSubmissionId(id);"
          new = """    const fingerprint = JSON.stringify({
              ...form,
              email: form.email.trim().toLowerCase(),
              name: form.name.trim(),
              whatsapp: form.whatsapp.trim(),
            });

            const id =
              submissionId && submissionFingerprint === fingerprint
                ? submissionId
                : newSubmissionId(\"owner-inquiry\");

            if (id !== submissionId) setSubmissionId(id);
            if (fingerprint !== submissionFingerprint) setSubmissionFingerprint(fingerprint);"""
          if old not in s:
              raise SystemExit("retry identity anchor not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Verify lint
        run: npm run lint
      - name: Verify production build
        run: npm run build
      - name: Commit owner retry fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/sell-with-us/page.tsx
          git commit -m "fix: owner retry identity"
          git push origin HEAD:feature/homepage-v2-crm-intake
