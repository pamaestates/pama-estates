name: Dependency Remediation

on:
  push:
    branches:
      - feature/homepage-v2-crm-intake

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, 'dependency lock refresh') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-v2-crm-intake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align patched Next.js framework and lint dependencies
        run: |
          npm install next@16.3.3 --save-exact
          npm install --save-dev eslint-config-next@16.3.3 --save-exact
          npm audit fix

      - name: Verify no high-severity dependency advisories remain
        run: npm audit --audit-level=high

      - name: Commit reproducible dependency lock refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: dependency lock refresh"
          git push origin HEAD:feature/homepage-v2-crm-intake
